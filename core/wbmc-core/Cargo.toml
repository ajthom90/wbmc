[package]
name = "wbmc-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
test-util = []

[dependencies]
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
async-trait = "0.1.92"
base64 = "0.22.1"
futures = "0.3.34"
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "system-config"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
mail-parser = { version = "0.11.9", features = ["full_encoding"] }
quick-xml = "0.42.0"
rand = "0.9.5"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "net", "io-util", "rt", "time", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
toml = "1.1.8"
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v7", "serde"] }

[dev-dependencies]
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
futures = "0.3.34"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
wiremock = "0.6.5"
