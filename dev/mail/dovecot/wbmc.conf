# Local benchmark mailbox for alice@wbmc.test.
# The host publishes IMAP only on 127.0.0.1. Inside the container the client
# address is the Docker bridge, so cleartext has to be allowed here; the bind
# address is what keeps it off every other interface.
auth_allow_cleartext = yes

mail_driver = maildir
mail_path = ~/Maildir
mailbox_list_layout = maildir++
